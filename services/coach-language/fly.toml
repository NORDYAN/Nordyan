# fly.toml app configuration file for coach-language
#
# Deploy from the NORDYAN repository root (required so Docker context includes
# shared/coach-language):
#
#   fly deploy . --config services/coach-language/fly.toml
#
# [build] paths below are relative to this fly.toml directory (not the repo root).
# See https://fly.io/docs/reference/configuration/

app = 'coach-language'
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'
  ignorefile = '.dockerignore'

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
